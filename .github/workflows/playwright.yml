name: '🎭 Tests Playwright'

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: 📚 Install dependencies
        run: npm install
      
      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: ✅ Run Playwright tests
        run: npm test
        env:
          CI: true
      
      - name: 📊 Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 30
      
      - name: 📹 Upload test videos (failures only)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos-node-${{ matrix.node-version }}
          path: test-results/
          retention-days: 7

  # Étape optionnelle : commentaire sur PR avec résultat
  pr-comment:
    name: 💬 Comment PR with results
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: 📝 Comment PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { status } = context.payload.pull_request;
            const testsPassed = '${{ needs.test.result }}' === 'success';
            
            const comment = testsPassed
              ? '✅ Tous les tests Playwright passent ! 🎉'
              : '❌ Certains tests ont échoué. Consulte le rapport des artifacts.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
