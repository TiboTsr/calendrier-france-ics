name: Update ICS

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays requests python-dateutil

      - name: Health Check CalendrierFR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/health_check.py --notify webhook
        continue-on-error: true

      - name: Generate ICS
        run: python calendrier.py

      - name: Validate ICS syntax
        run: python scripts/validate_ics.py

      - name: Update Sitemap lastmod
        run: |
          LASTMOD=$(date -u +"%Y-%m-%d")
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|g" sitemap.xml

      - name: Push generated files to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout de la branche data sans perdre les fichiers générés
          git fetch origin data
          git checkout data

          # Copier les fichiers générés
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier.ics       . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/zone-a.ics           . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/zone-b.ics           . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/zone-c.ics           . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier-essentiel.ics  . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier-culturel.ics   . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier-commercial.ics . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier-complet.ics    . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier.json       . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier.csv        . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/calendrier.xml        . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/events-meta.json      . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/zone-departments.json . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/../calendrier-france-ics/sitemap.xml           . 2>/dev/null || true

          git add .
          git diff --cached --quiet || git commit -m "🤖 Update ICS [skip ci]"
          git push origin data