name: Update ICS

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # nécessaire pour pouvoir checkout data

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays requests python-dateutil

      - name: Health Check CalendrierFR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/health_check.py --notify webhook
        continue-on-error: true

      - name: Generate ICS
        run: python calendrier.py

      - name: Validate ICS syntax
        run: python scripts/validate_ics.py

      - name: Update Sitemap lastmod
        run: |
          LASTMOD=$(date -u +"%Y-%m-%d")
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|g" sitemap.xml

      - name: Push generated files to data branch
        run: |
          # Sauvegarder les fichiers générés dans /tmp
          mkdir -p /tmp/generated
          cp calendrier.ics             /tmp/generated/ 2>/dev/null || true
          cp zone-a.ics                 /tmp/generated/ 2>/dev/null || true
          cp zone-b.ics                 /tmp/generated/ 2>/dev/null || true
          cp zone-c.ics                 /tmp/generated/ 2>/dev/null || true
          cp calendrier-essentiel.ics   /tmp/generated/ 2>/dev/null || true
          cp calendrier-culturel.ics    /tmp/generated/ 2>/dev/null || true
          cp calendrier-commercial.ics  /tmp/generated/ 2>/dev/null || true
          cp calendrier-complet.ics     /tmp/generated/ 2>/dev/null || true
          cp calendrier.json            /tmp/generated/ 2>/dev/null || true
          cp calendrier.csv             /tmp/generated/ 2>/dev/null || true
          cp calendrier.xml             /tmp/generated/ 2>/dev/null || true
          cp events-meta.json           /tmp/generated/ 2>/dev/null || true
          cp zone-departments.json      /tmp/generated/ 2>/dev/null || true
          cp sitemap.xml                /tmp/generated/ 2>/dev/null || true

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout branche data (les fichiers générés sont dans /tmp, pas de conflit)
          git stash --include-untracked
          git checkout data

          # Copier les fichiers depuis /tmp
          cp /tmp/generated/* .

          git add .
          git diff --cached --quiet || git commit -m "🤖 Update ICS [skip ci]"
          git push origin data