name: Update Generated Data

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays requests python-dateutil

      - name: Health Check CalendrierFR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/health_check.py --notify webhook
        continue-on-error: true

      - name: Generate files
        run: python calendrier.py

      - name: Validate ICS syntax
        run: python scripts/validate_ics.py

      - name: Publish generated files to data branch
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git worktree add -B data ../generated-data origin/data
          else
            git worktree add -b data ../generated-data
          fi

          mkdir -p ../generated-data

          for file in \
            calendrier.ics \
            calendrier-commercial.ics \
            calendrier-complet.ics \
            calendrier-culturel.ics \
            calendrier-essentiel.ics \
            calendrier.json \
            events-meta.json \
            calendrier.csv \
            calendrier.xml \
            sitemap.xml \
            zone-a.ics \
            zone-b.ics \
            zone-c.ics
          do
            cp "$file" ../generated-data/"$file"
          done

          LASTMOD=$(date -u +"%Y-%m-%d")
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|g" ../generated-data/sitemap.xml

          cd ../generated-data
          git add .
          git diff --cached --quiet || git commit -m "Update date files 🤖"
          git push origin HEAD:data

      - name: Cleanup worktree
        if: always()
        run: git worktree remove ../generated-data --force || true
