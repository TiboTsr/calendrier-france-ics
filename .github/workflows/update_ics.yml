name: Update ICS

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # nécessaire pour pouvoir checkout data

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays requests python-dateutil

      - name: Health Check CalendrierFR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/health_check.py --notify webhook
        continue-on-error: true

      - name: Generate ICS
        run: python calendrier.py

      - name: Validate ICS syntax
        run: python scripts/validate_ics.py

      - name: Update Sitemap lastmod
        run: |
          LASTMOD=$(date -u +"%Y-%m-%d")
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|g" sitemap.xml

