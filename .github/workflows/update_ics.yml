name: Update ICS

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # tous les jours à minuit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install holidays requests python-dateutil

      - name: Health Check CalendrierFR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/health_check.py --notify webhook
        continue-on-error: true

      - name: Generate ICS
        run: python calendrier.py

      - name: Validate ICS syntax
        run: python scripts/validate_ics.py

      - name: Update Sitemap lastmod
        run: |
          LASTMOD=$(date -u +"%Y-%m-%d")
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${LASTMOD}</lastmod>|g" sitemap.xml
          echo "Sitemap lastmod mis à jour : ${LASTMOD}"

      - name: Commit generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            calendrier.ics \
            zone-a.ics \
            zone-b.ics \
            zone-c.ics \
            calendrier-essentiel.ics \
            calendrier-culturel.ics \
            calendrier-commercial.ics \
            calendrier-complet.ics \
            calendrier.json \
            calendrier.csv \
            calendrier.xml \
            events-meta.json \
            zone-departments.json \
            sitemap.xml
          git diff --cached --quiet || git commit -m "🤖 Update ICS"
          git push