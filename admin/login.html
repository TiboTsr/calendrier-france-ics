<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin · Connexion</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="/img/icon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
:root{
  --bg0:#07070d;--bg1:#0e0e16;--bg2:#15151e;--bg3:#1c1c27;--bg4:#232330;
  --b:rgba(255,255,255,.07);--bh:rgba(255,255,255,.14);--ba:rgba(255,255,255,.26);
  --t1:#ededf4;--t2:#8080a0;--t3:#484860;
  --acc:#6b8cff;--accd:rgba(107,140,255,.10);--accb:rgba(107,140,255,.28);
  --red:#ff5a5a;--redd:rgba(255,90,90,.11);--redb:rgba(255,90,90,.30);
  --r:10px;--rl:16px;--rxl:22px;
  --ff:'DM Sans',sans-serif;--ffd:'Syne',sans-serif;--ffm:'DM Mono',monospace;
  --sh:0 2px 8px rgba(0,0,0,.45),0 8px 32px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;height:100%}
body{font-family:var(--ff);background:linear-gradient(135deg,rgba(15,15,22,1) 0%,rgba(20,30,60,.95) 25%,rgba(25,45,100,.9) 50%,rgba(20,30,60,.95) 75%,rgba(15,15,22,1) 100%);background-attachment:fixed;color:var(--t1);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;top:10%;right:-5%;width:500px;height:500px;background:radial-gradient(circle at 30% 30%,rgba(107,140,255,.25) 0%,rgba(107,140,255,.08) 35%,transparent 70%);border-radius:999px;animation:blob1 25s ease-in-out infinite;filter:blur(40px);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:5%;left:-3%;width:450px;height:450px;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.2) 0%,rgba(34,211,238,.06) 40%,transparent 75%);border-radius:999px;animation:blob2 30s ease-in-out infinite;filter:blur(45px);pointer-events:none;z-index:0}
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-30px,30px) scale(1.05)}66%{transform:translate(20px,-40px) scale(.95)}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-20px) scale(1.1)}66%{transform:translate(-30px,30px) scale(.9)}}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff);cursor:pointer;border:none;background:none;color:inherit}
input{font-family:var(--ff);font-size:14px;color:var(--t1)}
*:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.login-container{max-width:420px;width:100%;position:relative;z-index:1}
.login-card{border:1px solid rgba(107,140,255,.2);border-radius:20px;background:rgba(15,15,22,.5);padding:48px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.login-header{margin-bottom:32px;text-align:center}
.login-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px}
.flag{width:32px;height:22px;border-radius:3px;overflow:hidden;display:flex;border:1px solid rgba(0,0,0,.2)}
.flag span{flex:1;display:block}
.login-title{font-family:var(--ffd);font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--t1)}
.login-subtitle{font-size:13px;color:var(--t2);margin-top:8px}
.form-group{margin-bottom:24px}
.form-label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:8px}
.form-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(107,140,255,.15);background:rgba(28,28,39,.7);color:var(--t1);font-size:14px;transition:all .3s cubic-bezier(.34,.1,.64,.35)}
.form-input:hover{border-color:rgba(107,140,255,.25);background:rgba(28,28,39,.9)}
.form-input:focus{outline:none;border-color:var(--acc);background:rgba(28,28,39,1);box-shadow:0 0 0 3px rgba(107,140,255,.15),0 8px 24px rgba(107,140,255,.1)}
.form-input::placeholder{color:var(--t3)}
.form-actions{display:flex;gap:12px;margin-top:32px}
.btn-login{flex:1;padding:12px 24px;border-radius:10px;background:linear-gradient(135deg,var(--acc) 0%,rgba(107,140,255,.8) 100%);color:#fff;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .3s cubic-bezier(.34,.1,.64,.35);box-shadow:0 8px 24px rgba(107,140,255,.25);position:relative;overflow:hidden}
.btn-login::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(255,255,255,.1);transition:left .4s}
.btn-login:hover::before{left:100%}
.btn-login:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(107,140,255,.35)}
.btn-login:active{transform:translateY(-1px)}
.btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13px;display:none;animation:slideUp .3s ease;border-left:4px solid transparent}
.msg.error{background:rgba(255,90,90,.12);color:#ff5a5a;border:1px solid rgba(255,90,90,.3);border-left-color:#ff5a5a;display:block}
.msg.success{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3);border-left-color:#10b981;display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="flag" role="img" aria-label="Drapeau français"><span style="background:#002395"></span><span style="background:#ECECEC"></span><span style="background:#ED2939"></span></div>
          <span style="font-family:var(--ffd);font-weight:700;font-size:16px">Admin</span>
        </div>
        <h1 class="login-title">Connexion</h1>
        <p class="login-subtitle">Calendrier France</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="password" class="form-label">🔐 Mot de passe</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Entrez le mot de passe" required autofocus/>
        </div>

        <div id="msg" class="msg" role="status" aria-live="polite"></div>

        <div class="form-actions">
          <button type="submit" class="btn-login" id="btn-login">
            <i class="fa-solid fa-lock-open" style="margin-right:8px;font-size:13px"></i> Connexion
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('login-form');
      const msgEl = document.getElementById('msg');
      const btnLogin = document.getElementById('btn-login');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.className = 'msg';

        const password = document.getElementById('password').value;

        btnLogin.disabled = true;
        msgEl.textContent = 'Vérification...';
        msgEl.className = 'msg';

        try {
          const response = await fetch('/api/admin-auth?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ password }),
          });

          const data = await response.json();

          if (response.ok) {
            msgEl.textContent = '✅ Connexion réussie. Redirection...';
            msgEl.className = 'msg success';
            setTimeout(() => {
              window.location.href = '/admin';
            }, 1000);
          } else {
            msgEl.textContent = '❌ ' + (data.error || 'Erreur de connexion');
            msgEl.className = 'msg error';
            btnLogin.disabled = false;
            document.getElementById('password').focus();
          }
        } catch (err) {
          msgEl.textContent = '❌ Erreur réseau ou serveur';
          msgEl.className = 'msg error';
          btnLogin.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
