<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Simplifié · Calendrier France</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="/img/icon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<style>
:root{
  --bg0:#07070d;--bg1:#0e0e16;--bg2:#15151e;--bg3:#1c1c27;--bg4:#232330;
  --b:rgba(255,255,255,.07);--bh:rgba(255,255,255,.14);--ba:rgba(255,255,255,.26);
  --t1:#ededf4;--t2:#8080a0;--t3:#484860;
  --acc:#6b8cff;--accd:rgba(107,140,255,.10);--accb:rgba(107,140,255,.28);
  --red:#ff5a5a;--redd:rgba(255,90,90,.11);--redb:rgba(255,90,90,.30);
  --grn:#3ecf8e;--grnd:rgba(62,207,142,.11);--grnb:rgba(62,207,142,.28);
  --r:10px;--rl:16px;--ff:'DM Sans',sans-serif;--ffd:'Syne',sans-serif;--ffm:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:var(--ff);background:var(--bg0);color:var(--t1);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--ff);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--ff);font-size:14px;color:var(--t1)}
*:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.container{max-width:1200px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;border-bottom:1px solid var(--b);padding-bottom:20px}
.header h1{font-family:var(--ffd);font-size:32px;font-weight:800}
.btn-logout{background:var(--redd);color:var(--red);border:1px solid var(--redb);padding:8px 16px;border-radius:var(--r);transition:.2s}
.btn-logout:hover{background:var(--red);color:white}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:40px}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:20px}
.card h3{font-family:var(--ffd);margin-bottom:15px;color:var(--acc)}
.stat-value{font-family:var(--ffm);font-size:28px;font-weight:700;color:var(--acc)}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);margin-top:5px}

.form-group{margin-bottom:15px}
.form-group label{display:block;font-weight:500;margin-bottom:5px;color:var(--t1)}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--r);color:var(--t1);font-family:var(--ff)
}
.form-group textarea{resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  border-color:var(--acc);background:var(--bg4)
}

.btn{background:var(--accd);color:var(--acc);border:1px solid var(--accb);padding:10px 20px;border-radius:var(--r);cursor:pointer;transition:.2s;font-weight:600}
.btn:hover{background:var(--acc);color:var(--bg0)}
.btn-small{padding:6px 12px;font-size:12px}

.section{margin-bottom:40px}
.section h2{font-family:var(--ffd);font-size:20px;margin-bottom:20px;color:var(--acc)}

table{width:100%;border-collapse:collapse}
table th{background:var(--bg3);padding:12px;text-align:left;font-weight:600;border-bottom:1px solid var(--b)}
table td{padding:12px;border-bottom:1px solid var(--b)}
table tr:hover{background:var(--bg3)}

.pending-item{background:var(--bg3);border-left:4px solid var(--acc);padding:15px;margin-bottom:10px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center}
.pending-item-info{flex:1}
.pending-item-date{font-size:12px;color:var(--t3)}
.pending-item-emoji{font-size:24px;margin-right:10px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--grn);color:white;padding:15px 20px;border-radius:var(--r);z-index:9999;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Admin Calendrier</h1>
    <button class="btn-logout" onclick="logout()">Déconnexion</button>
  </div>

  <!-- STATS -->
  <div class="grid">
    <div class="card">
      <h3>📊 Événements</h3>
      <div class="stat-value" id="stat-events">-</div>
      <div class="stat-label">total dans le calendrier</div>
    </div>
    <div class="card">
      <h3>⏳ Provisoires</h3>
      <div class="stat-value" id="stat-pending">-</div>
      <div class="stat-label">en attente</div>
    </div>
    <div class="card">
      <h3>💬 Suggestions</h3>
      <div class="stat-value" id="stat-suggestions">-</div>
      <div class="stat-label">à modérer</div>
    </div>
  </div>

  <!-- AJOUTER UN ÉVÉNEMENT PROVISOIRE -->
  <div class="section">
    <h2>➕ Ajouter un événement provisoire</h2>
    <div class="card">
      <form onsubmit="addPendingEvent(event)">
        <div class="form-group">
          <label>Titre</label>
          <input type="text" id="form-title" placeholder="ex: Festival de Cinéma" required/>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="form-date" required/>
        </div>
        <div class="form-group">
          <label>Catégories (séparées par virgule)</label>
          <input type="text" id="form-categories" placeholder="ex: Culture, Cinéma"/>
        </div>
        <div class="form-group">
          <label>Emoji</label>
          <input type="text" id="form-emoji" placeholder="🎬" maxlength="2" style="font-size:24px;text-align:center"/>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="form-description" placeholder="Détails de l'événement..."></textarea>
        </div>
        <button type="submit" class="btn">Ajouter</button>
      </form>
    </div>
  </div>

  <!-- ÉVÉNEMENTS PROVISOIRES -->
  <div class="section">
    <h2>⏳ Événements en attente</h2>
    <div id="pending-list"></div>
  </div>

  <!-- PENSE-BÊTE / TODO -->
  <div class="section">
    <h2>📝 Pense-bête</h2>
    <div class="card">
      <form onsubmit="addTodo(event)">
        <div class="form-group">
          <label>Nouvelle note</label>
          <input type="text" id="todo-input" placeholder="Ajouter X au code, modifier Y..."/>
        </div>
        <button type="submit" class="btn">Ajouter</button>
      </form>
    </div>
    <div id="todo-list" style="margin-top:20px"></div>
  </div>

  <!-- SUGGESTIONS UTILISATEURS -->
  <div class="section">
    <h2>💬 Suggestions (modération)</h2>
    <table>
      <thead>
        <tr>
          <th>Événement</th>
          <th>Email</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="suggestions-table">
        <tr><td colspan="4" style="text-align:center;color:var(--t3)">Chargement...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
// STATE
const state = {
  pending: [],
  todos: JSON.parse(localStorage.getItem('admin-todos') || '[]'),
  suggestions: []
};

// LOAD DATA
async function loadData() {
  try {
    const [pendRes, suggRes] = await Promise.all([
      fetch('/api/pending-events'),
      fetch('/api/suggestions')
    ]);
    
    state.pending = (await pendRes.json()).events || [];
    state.suggestions = await suggRes.json() || [];
    
    updateUI();
  } catch (e) {
    console.error('Load error:', e);
    toast('Erreur lors du chargement', 'error');
  }
}

// ADD PENDING EVENT
async function addPendingEvent(e) {
  e.preventDefault();
  const event = {
    summary: document.getElementById('form-title').value,
    start: document.getElementById('form-date').value,
    categories: document.getElementById('form-categories').value.split(',').map(c => c.trim()).filter(Boolean),
    emoji: document.getElementById('form-emoji').value || '📌',
    description: document.getElementById('form-description').value
  };

  try {
    const res = await fetch('/api/pending-events', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(event)
    });
    if (!res.ok) throw new Error('Failed to create');
    toast('Événement ajouté ✓', 'success');
    e.target.reset();
    loadData();
  } catch (err) {
    toast('Erreur: ' + err.message, 'error');
  }
}

// DELETE PENDING EVENT
async function deletePending(id) {
  if (!confirm('Supprimer cet événement provisoire?')) return;
  try {
    const res = await fetch('/api/pending-events', {
      method: 'DELETE',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    if (!res.ok) throw new Error('Failed to delete');
    toast('Supprimé ✓', 'success');
    loadData();
  } catch (err) {
    toast('Erreur: ' + err.message, 'error');
  }
}

// SUGGESTIONS MODERATION
async function acceptSuggestion(id) {
  try {
    const res = await fetch('/api/suggestions', {
      method: 'PATCH',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status: 'accepted' })
    });
    if (!res.ok) throw new Error('Failed to accept');
    toast('Acceptée ✓', 'success');
    loadData();
  } catch (err) {
    toast('Erreur: ' + err.message, 'error');
  }
}

async function rejectSuggestion(id) {
  try {
    const res = await fetch('/api/suggestions', {
      method: 'PATCH',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, status: 'rejected' })
    });
    if (!res.ok) throw new Error('Failed to reject');
    toast('Rejetée ✓', 'success');
    loadData();
  } catch (err) {
    toast('Erreur: ' + err.message, 'error');
  }
}

// TODO MANAGEMENT
function addTodo(e) {
  e.preventDefault();
  const text = document.getElementById('todo-input').value;
  if (!text) return;
  state.todos.push({ id: Date.now(), text, done: false });
  localStorage.setItem('admin-todos', JSON.stringify(state.todos));
  document.getElementById('todo-input').value = '';
  updateUI();
}

function toggleTodo(id) {
  const todo = state.todos.find(t => t.id === id);
  if (todo) {
    todo.done = !todo.done;
    localStorage.setItem('admin-todos', JSON.stringify(state.todos));
    updateUI();
  }
}

function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  localStorage.setItem('admin-todos', JSON.stringify(state.todos));
  updateUI();
}

// UPDATE UI
function updateUI() {
  // Stats
  document.getElementById('stat-pending').textContent = state.pending.length;
  document.getElementById('stat-suggestions').textContent = state.suggestions.length;
  
  // Pending events
  const pendingHtml = state.pending.map(p => `
    <div class="pending-item">
      <div style="display:flex;align-items:center;flex:1">
        <span class="pending-item-emoji">${p.emoji || '📌'}</span>
        <div class="pending-item-info">
          <strong>${p.summary}</strong>
          <br/>
          <span class="pending-item-date">${p.start} • ${p.categories.join(', ')}</span>
        </div>
      </div>
      <button class="btn btn-small" style="background:var(--redd);color:var(--red)" onclick="deletePending('${p.id}')">Supprimer</button>
    </div>
  `).join('');
  document.getElementById('pending-list').innerHTML = pendingHtml || '<p style="color:var(--t3)">Aucun événement en attente</p>';

  // Todo list
  const todoHtml = state.todos.map(t => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border-radius:var(--r);margin-bottom:8px">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${t.id})" style="cursor:pointer"/>
      <span style="${t.done ? 'text-decoration:line-through;color:var(--t3)' : ''};flex:1">${t.text}</span>
      <button class="btn btn-small" style="background:var(--redd);color:var(--red)" onclick="deleteTodo(${t.id})">✕</button>
    </div>
  `).join('');
  document.getElementById('todo-list').innerHTML = todoHtml || '<p style="color:var(--t3)">Aucune note</p>';

  // Suggestions
  const suggHtml = state.suggestions.length ? state.suggestions.map(s => `
    <tr>
      <td>${s.summary || '-'}</td>
      <td>${s.email}</td>
      <td>${s.date || '-'}</td>
      <td><button class="btn btn-small" onclick="acceptSuggestion('${s.id}')">✓</button> <button class="btn btn-small" style="background:var(--redd);color:var(--red)" onclick="rejectSuggestion('${s.id}')">✕</button></td>
    </tr>
  `).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--t3)">Aucune suggestion</td></tr>';
  document.getElementById('suggestions-table').innerHTML = suggHtml;

  // Event count
  const eventCountDiv = document.getElementById('stat-events');
  if (eventCountDiv) {
    fetch('/api/admin-calendar?count=true')
      .then(r => r.json())
      .then(d => { eventCountDiv.textContent = d.total || 0; })
      .catch(() => { eventCountDiv.textContent = '?'; });
  }
}

// LOGOUT
async function logout() {
  await fetch('/api/admin-auth?action=logout', { method: 'POST' });
  window.location.href = '/admin/login';
}

// TOAST
function toast(msg, type = 'info') {
  const z = document.getElementById('toast');
  const d = document.createElement('div');
  d.className = 'toast';
  d.style.background = type === 'success' ? 'var(--grn)' : type === 'error' ? 'var(--red)' : 'var(--acc)';
  d.textContent = msg;
  z.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

// INIT
loadData();
setInterval(loadData, 30000); // Refresh every 30s
</script>
</body>
</html>
